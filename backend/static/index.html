<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supatask - Task Manager</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">⚡ Supatask</h1>
                <div class="header-actions">
                    <button class="btn btn-icon" data-action="toggle-logs" title="View Logs">
                        📋
                    </button>
                    <button class="btn btn-primary" data-action="create-task">
                        + New Task
                    </button>
                </div>
            </div>
        </header>

        <!-- Filters -->
        <div class="filters">
            <select id="statusFilter">
                <option value="">All Status</option>
                <option value="pending">Pending</option>
                <option value="in_progress">In Progress</option>
                <option value="completed">Completed</option>
                <option value="archived">Archived</option>
            </select>
            <input type="text" id="tagFilter" placeholder="Filter by tags (comma-separated)">
            <input type="date" id="dateAfter">
            <input type="date" id="dateBefore">
            <button class="btn btn-secondary" data-action="clear-filters">Clear Filters</button>
        </div>

        <!-- Task List -->
        <div class="task-grid" id="taskGrid">
            <div class="loading">Loading tasks...</div>
        </div>

        <!-- Log Panel -->
        <div class="log-panel" id="logPanel">
            <div class="log-header">
                <h3>Activity Logs</h3>
                <button class="btn btn-icon" data-action="toggle-logs">✕</button>
            </div>
            <div class="log-content" id="logContent">
                <div class="loading">Loading logs...</div>
            </div>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Create Task</h2>
                <button class="btn btn-icon" data-action="close-modal">✕</button>
            </div>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Title *</label>
                    <input type="text" id="taskTitle" required maxlength="200">
                </div>
                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label for="taskStatus">Status</label>
                    <select id="taskStatus">
                        <option value="pending">Pending</option>
                        <option value="in_progress">In Progress</option>
                        <option value="completed">Completed</option>
                        <option value="archived">Archived</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="taskTags">Tags (comma-separated)</label>
                    <input type="text" id="taskTags" placeholder="work, urgent, backend">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>

</html>
